name: Deploy to Hostinger

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "deploy_path=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "deploy_path=${{ secrets.TEST_DEPLOY_PATH }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "deploy_path=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_OUTPUT
          fi

          # Debug output
          echo "DEBUG: Environment = dev"
          echo "DEBUG: Deploy path secret = ${{ secrets.DEV_DEPLOY_PATH }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Build Assets
        run: npm run build

      - name: Get Short Commit Hash
        id: commit
        run: echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Deployment Directory Name
        id: deploy_dir
        run: echo "dir_name=${{ steps.commit.outputs.short_hash }}-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Prepare Deployment Files
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          mkdir -p deploy_package
          echo "Preparing deployment package for environment: $ENVIRONMENT"

          # Copy directories
          cp -r app/ deploy_package/
          cp -r bootstrap/ deploy_package/
          cp -r config/ deploy_package/
          cp -r database/ deploy_package/
          cp -r public/ deploy_package/
          cp -r resources/ deploy_package/
          cp -r routes/ deploy_package/
          cp -r storage/ deploy_package/
          cp -r vendor/ deploy_package/

          # Copy environment-specific .env file with proper error handling
          ENV_FILE=".env.${ENVIRONMENT}"
          if [ -f "$ENV_FILE" ]; then
            echo "✓ Copying environment file: $ENV_FILE"
            cp "$ENV_FILE" deploy_package/.env
          elif [ -f ".env.example" ]; then
            echo "⚠ Environment file not found: $ENV_FILE"
            echo "⚠ Using fallback: .env.example"
            cp .env.example deploy_package/.env
          else
            echo "ERROR: No environment file found!"
            echo "  Expected: $ENV_FILE"
            echo "  Fallback: .env.example"
            ls -la .env* 2>/dev/null || echo "No .env files found"
            exit 1
          fi

          # Verify .env was copied
          if [ ! -f "deploy_package/.env" ]; then
            echo "ERROR: Failed to copy .env file to deploy_package"
            exit 1
          fi
          echo "✓ .env file successfully copied to deploy_package/"

          # Copy configuration and other files
          cp artisan deploy_package/
          cp composer.json deploy_package/
          cp composer.lock deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          cp tsconfig.json deploy_package/
          cp vite.config.ts deploy_package/
          cp phpunit.xml deploy_package/
          cp eslint.config.js deploy_package/

          echo "✓ All deployment files prepared successfully"
          echo "Deployment package contents:"
          ls -la deploy_package/ | head -20

      - name: Create Deployment Archive
        run: |
          zip -q -r deploy_package.zip deploy_package/* deploy_package/.env

      - name: Create Deployment Directory on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BASE_PATH="${{ secrets.DEV_DEPLOY_PATH }}"
            DIR_NAME="${{ steps.deploy_dir.outputs.dir_name }}"
            DEPLOY_PATH="$BASE_PATH/$DIR_NAME"

            echo "DEBUG: Base path: $BASE_PATH"
            echo "DEBUG: Dir name: $DIR_NAME"
            echo "DEBUG: Full path: $DEPLOY_PATH"

            if [ -z "$BASE_PATH" ]; then
              echo "ERROR: DEV_DEPLOY_PATH secret is not set!"
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"
            if [ $? -eq 0 ]; then
              echo "✓ [${{ steps.env.outputs.environment }}] Deployment directory created: $DEPLOY_PATH"
              ls -la "$DEPLOY_PATH"
            else
              echo "ERROR: Failed to create deployment directory: $DEPLOY_PATH"
              exit 1
            fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload Files via SCP
        run: |
          BASE_PATH="${{ secrets.DEV_DEPLOY_PATH }}"
          DIR_NAME="${{ steps.deploy_dir.outputs.dir_name }}"
          DEPLOY_PATH="$BASE_PATH/$DIR_NAME"

          echo "DEBUG: Full deploy path: $DEPLOY_PATH"
          echo "DEBUG: Deploy base path: $BASE_PATH"
          echo "DEBUG: Deploy dir name: $DIR_NAME"

          if [ -z "$BASE_PATH" ] || [ "$BASE_PATH" = "/" ]; then
            echo "ERROR: Deploy path is empty or invalid!"
            exit 1
          fi

          if [ ! -f "./deploy_package.zip" ]; then
            echo "ERROR: deploy_package.zip not found!"
            ls -la
            exit 1
          fi

          if [ ! -f "./deploy_package/.env" ]; then
            echo "ERROR: .env file not found in deploy_package!"
            ls -la deploy_package/
            exit 1
          fi

          echo "✓ Files ready for upload:"
          echo "  - deploy_package.zip ($(du -h ./deploy_package.zip | cut -f1))"
          echo "  - deploy_package/.env"

          echo "Uploading to: ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/"
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts -v ./deploy_package.zip ./deploy_package/.env ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:"$DEPLOY_PATH/" 2>&1 | grep -E "(upload|sent|received|ERROR|error)" | tail -20

          if [ $? -eq 0 ]; then
            echo "✓ Files uploaded successfully"
          else
            echo "ERROR: File upload failed!"
            exit 1
          fi

      - name: Extract and Setup on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BASE_PATH="${{ secrets.DEV_DEPLOY_PATH }}"
            DIR_NAME="${{ steps.deploy_dir.outputs.dir_name }}"
            DEPLOY_PATH="$BASE_PATH/$DIR_NAME"

            echo "DEBUG: Extracting from: $DEPLOY_PATH"

            # Verify directory exists
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "ERROR: Deployment directory does not exist: $DEPLOY_PATH"
              exit 1
            fi

            # Verify zip file exists
            if [ ! -f "$DEPLOY_PATH/deploy_package.zip" ]; then
              echo "ERROR: Deploy package zip not found at: $DEPLOY_PATH/deploy_package.zip"
              ls -la "$DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # Extract the zip file
            echo "Extracting zip file..."
            unzip -q deploy_package.zip

            # Move contents from deploy_package to current directory
            echo "Organizing files..."
            mv deploy_package/* .

            # Remove the extracted directory and zip file
            #rmdir deploy_package
            #rm deploy_package.zip

            echo "✓ [${{ steps.env.outputs.environment }}] Archive extracted and files organized"

      - name: Post-Deployment Tasks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BASE_PATH="${{ secrets.DEV_DEPLOY_PATH }}"
            DIR_NAME="${{ steps.deploy_dir.outputs.dir_name }}"
            DEPLOY_PATH="$BASE_PATH/$DIR_NAME"
            echo "DEBUG: Running post-deployment tasks in: $DEPLOY_PATH"

            cd ~
            cd "$DEPLOY_PATH"
            echo "✓ [${{ steps.env.outputs.environment }}] Changed to deployment directory: $PWD"

            # Verify .env exists
            if [ ! -f .env ]; then
              echo "Error: .env file not found after extraction"
              exit 1
            fi

            echo "✓ [${{ steps.env.outputs.environment }}] Deployment completed successfully!"
            echo "✓ [${{ steps.env.outputs.environment }}] Application deployed to: $DEPLOY_PATH"

      - name: Post Deployment DB Migration
        run: |
          sed -i 's/DB_HOST=localhost/DB_HOST=82.25.121.183/g' .env
          php artisan migrate --force
